  - datasetName: NIPA
    tableName: T20306
    frequency: Q
    year: X
    tier: A
    collect_enabled: true
    title: Real PCE major product types (NIPA T20306)

  - datasetName: NIPA
    tableName: T11000
    frequency: Q
    year: X
    tier: B
    collect_enabled: true
    title: Price indexes for GDP (NIPA T11000)

  - datasetName: NIPA
    tableName: T20405
    frequency: A
    year: X
    tier: B
    collect_enabled: true
