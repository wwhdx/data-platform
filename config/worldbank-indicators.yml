# World Bank Tier A/B 采集清单（Git 真源）
# 运行 pnpm cli worldbank catalog sync 后用 L0 校验 code；node scripts/verify-worldbank-indicators.mjs
defaults:
  countries: [US, CN, IN, JP, DE, GB]
  mrv: 5
indicators:
  # topic 3 — Economy & Growth
  - code: NY.GDP.MKTP.CD
    tier: A
    collect_enabled: true
    title: GDP (current US$)
    topic_id: "3"
    # industry_tag: 国民经济

  - code: NY.GDP.PCAP.CD
    tier: A
    collect_enabled: true
    title: GDP per capita
    topic_id: "3"

  - code: NE.EXP.GNFS.ZS
    tier: A
    collect_enabled: true
    title: Exports % of GDP
    topic_id: "3"

  # topic 11 — Poverty
  - code: SI.POV.DDAY
    tier: A
    collect_enabled: true
    title: Poverty headcount ratio at $2.15/day
    topic_id: "11"
    # industry_tag: 社会

  # topic 8 — Health（U-L1 医疗宏观锚 · worldbank）
  - code: SP.DYN.LE00.IN
    tier: A
    collect_enabled: true
    title: Life expectancy at birth
    topic_id: "8"
    industry_tag: 医疗

  - code: SH.XPD.CHEX.GD.ZS
    tier: A
    collect_enabled: true
    title: Current health expenditure % of GDP
    topic_id: "8"
    industry_tag: 医疗

  # topic 4 — Education
  - code: SE.ADT.LITR.ZS
    tier: A
    collect_enabled: true
    title: Literacy rate adult total
    topic_id: "4"

  # topic 10 — Environment
  - code: EN.ATM.PM25.MC.M3
    tier: A
    collect_enabled: true
    title: PM2.5 air pollution mean annual exposure
    topic_id: "10"
    # industry_tag: 环境

  - code: EG.USE.ELEC.KH.PC
    tier: A
    collect_enabled: true
    title: Electric power consumption kWh per capita
    topic_id: "10"
    # industry_tag: 能源

  # topic 19 — Climate Change
  - code: EG.FEC.RNEW.ZS
    tier: A
    collect_enabled: true
    title: Renewable energy consumption % of total final energy
    topic_id: "19"

  # topic 12 — Trade
  - code: NE.TRD.GNFS.ZS
    tier: A
    collect_enabled: true
    title: Trade % of GDP
    topic_id: "12"

  # topic 9 — Infrastructure
  - code: IT.NET.USER.ZS
    tier: A
    collect_enabled: true
    title: Individuals using the Internet %
    topic_id: "9"

  # topic 2 — Aid Effectiveness (劳动代理：失业率在 WDI 常归 Social）
  - code: SL.UEM.TOTL.ZS
    tier: A
    collect_enabled: true
    title: Unemployment total % of labor force
    topic_id: "2"
    # industry_tag: 劳动

  - code: FP.CPI.TOTL.ZG
    tier: A
    collect_enabled: true
    title: Inflation consumer prices annual %
    topic_id: "3"

  - code: SP.POP.TOTL
    tier: A
    collect_enabled: true
    title: Population total
    topic_id: "3"

  # topic 1 — Agriculture & Rural Development
  - code: AG.LND.AGRI.K2
    tier: A
    collect_enabled: true
    title: Agricultural land (sq. km)
    topic_id: "1"
    # industry_tag: 农业

  - code: AG.PRD.CROP.XD
    tier: A
    collect_enabled: true
    title: Crop production index (2014-2016 = 100)
    topic_id: "1"

  - code: SL.AGR.EMPL.ZS
    tier: A
    collect_enabled: true
    title: Employment in agriculture % of total employment
    topic_id: "1"

  # topic 16 — Urban Development
  - code: SP.URB.TOTL.IN.ZS
    tier: A
    collect_enabled: true
    title: Urban population % of total
    topic_id: "16"
    # industry_tag: 城建

  # topic 3 — Economy（GNI，与 GDP 互补）
  - code: NY.GNP.MKTP.CD
    tier: A
    collect_enabled: true
    title: GNI (current US$)
    topic_id: "3"

  # topic 5 — Energy & Mining
  - code: EG.IMP.CONS.ZS
    tier: A
    collect_enabled: true
    title: Energy imports net % of energy use
    topic_id: "5"

  # topic 6 — Environment
  - code: AG.LND.FRST.ZS
    tier: A
    collect_enabled: true
    title: Forest area % of land area
    topic_id: "6"
    # industry_tag: 环境

  # topic 7 — Financial Sector
  - code: BX.KLT.DINV.WD.GD.ZS
    tier: A
    collect_enabled: true
    title: FDI net inflows % of GDP
    topic_id: "7"

  - code: BM.KLT.DINV.CD.WD
    tier: A
    collect_enabled: true
    title: FDI net outflows BoP current US$
    topic_id: "7"

  # topic 13 — Public Sector
  - code: GC.TAX.TOTL.GD.ZS
    tier: A
    collect_enabled: true
    title: Tax revenue % of GDP
    topic_id: "13"
    # industry_tag: 财政

  # topic 15 — Social Protection
  - code: MS.MIL.XPND.GD.ZS
    tier: A
    collect_enabled: true
    title: Military expenditure % of GDP
    topic_id: "15"
