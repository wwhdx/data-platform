# U-L1 行业最小语料策略（Git 真源）
# 仅对 industry_tags.is_active=true 且本文件有条目的行业注册弱信号 collect
# 宏观锚：树形 YAML 行 industry_tag + 每行业单一 macro.source
defaults:
  text_collect_max_items: 200
  macro_min_docs: 10
  text_min_docs: 50

industries:
  医疗:
    macro:
      source: worldbank
      virtual_source_id: worldbank_医疗
      tier: A
    text:
      source: pubmed
      virtual_source_id: pubmed_医疗
      queries:
        - "diabetes artificial intelligence"
        - "clinical trial machine learning"
      schedule: "0 6 * * 1"

  能源:
    macro:
      source: eia
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_能源
      queries:
        - "renewable energy storage"
        - "grid decarbonization"
      schedule: "0 7 * * 1"

  农业:
    macro:
      source: ecb
      virtual_source_id: ecb_农业
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_农业
      queries:
        - "precision agriculture machine learning"
        - "crop yield prediction satellite"
      schedule: "0 8 * * 1"

  建筑:
    macro:
      source: fred
      virtual_source_id: fred_建筑
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_建筑
      queries:
        - "green building construction technology"
        - "building information modeling BIM"
      schedule: "0 9 * * 1"

  食品安全:
    macro:
      source: eurostat
      virtual_source_id: eurostat_食品安全
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_食品安全
      queries:
        - "food safety traceability"
        - "food contamination detection"
      schedule: "0 10 * * 1"

  水资源:
    macro:
      source: census
      virtual_source_id: census_水资源
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_水资源
      queries:
        - "water resource management"
        - "wastewater treatment technology"
      schedule: "0 11 * * 1"

  电器制造:
    macro:
      source: bea
      virtual_source_id: bea_电器制造
      tier: A
    text:
      source: openalex
      virtual_source_id: openalex_电器制造
      queries:
        - "smart manufacturing industry 4.0"
        - "power electronics systems"
      schedule: "0 12 * * 1"
