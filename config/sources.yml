# ═══════════════════════════════════════════════════════════════
# data-platform 数据源配置文件 (v1.1)
# ═══════════════════════════════════════════════════════════════
# 优先级：环境变量 > 数据库 > 此文件（展开后）> Connector META
# 修改后：pnpm cli config validate → pnpm cli config sync（或 restart app 自动 sync）
# 设计：docs/plans/数据源配置-interface-profile实施方案.md
#
# ── 数据源角色（真源 vs 中间商）────────────────────────────────
# 详述：docs/plans/待接入数据源清单与波次方案.md §7
# role:     primary=内容真源 | registry=DOI/NCT 登记 | aggregator=聚合商
#           graph=引文边 | mirror=官方镜像 | secondary=二手/非官方
# collect:  main=主路径 | supplement=补字段，勿与同簇 main 并行 cron
#           fallback=主源缺全文再开 | analysis=离线 SQL/分析
# cluster:  重叠簇名（见 §7.3 互斥规则）
# 去重：dedup 仅 (source_id, external_id)；跨源 DOI 合并尚未实现
#
# Lane A（W-AGG，2026-05-21 落地）：
#   W-AGG-1  openalex cron ON · semanticscholar cron OFF（二选一；S2 保留手动 collect）
#   W-AGG-2  google_patents cron OFF（仅 pnpm cli collect 按需 BigQuery）
#   W-AGG-3  core 保持 disabled（fallback）
# ═══════════════════════════════════════════════════════════════

version: "1.1"

defaults:
  user_agent: "WangyeDataPlatform/0.1 (mailto:dev@wangye.app)"
  request_timeout_ms: 30000
  max_retries: 5

interface_profiles:
  rest_query_param_key:
    protocol: rest
    auth_type: query_param_key

  youtube_api:
    extends: rest_query_param_key
    base_url: https://www.googleapis.com/youtube/v3/
    env_key: YOUTUBE_API_KEY
    rate_limit: "10000 units/day (search=100 units)"

  ncbi_eutils:
    extends: rest_query_param_key
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    env_key: NCBI_API_KEY
    rate_limit: "10/sec (with key)"
    pagination: webenv_history
    pipeline: [esearch, efetch]

  rest_header_custom:
    protocol: rest
    auth_type: header_custom

  rest_polite:
    protocol: rest
    auth_type: polite_id

  rest_none:
    protocol: rest
    auth_type: none

  firebase_rest:
    protocol: firebase_rest
    auth_type: none
    base_url: https://hacker-news.firebaseio.com/v0/

  rest_bearer:
    protocol: rest
    auth_type: header_bearer

  arxiv_legacy_rest:
    protocol: rest
    auth_type: none
    base_url: https://export.arxiv.org/api/query

  oai_pmh:
    protocol: oai-pmh
    auth_type: none
    base_url: https://oaipmh.arxiv.org/oai

  oauth2_rest:
    protocol: rest
    auth_type: oauth2
    base_url: https://ops.epo.org/rest-services/

  bigquery_sql:
    protocol: bigquery_sql
    auth_type: oauth2

  graphql_github:
    protocol: graphql
    auth_type: header_bearer

# schedule（cron「分 时 日 月 周」，服务器本地时区）：
#   批处理：每日 03:00 → `0 3 * * *`
#   慢变数据：每周日 03:00 → `0 3 * * 0`
#   实时热点：hackernews 每 1 小时 → `0 */1 * * *`
sources:
  # role: aggregator | collect: supplement | cluster: academic_metadata
  # W-AGG-1：主图谱 cron 保留 openalex；semanticscholar 已关 cron（可手动 collect）
  - id: openalex
    profile: rest_query_param_key
    name: OpenAlex
    enabled: true
    base_url: https://api.openalex.org
    rate_limit: "100000/day"
    license: CC0
    commercial_use: true
    schedule: "0 3 * * *"
    description: "2.4亿+ 学术作品元数据，CC0 完全开放，含作者/机构/引用/主题"

  # role: registry | collect: supplement | cluster: academic_metadata
  # DOI 元数据权威；正文在出版商，摘要覆盖率低
  - id: crossref
    profile: rest_polite
    name: CrossRef
    enabled: true
    base_url: https://api.crossref.org/v1
    rate_limit: "5 RPS (polite pool)"
    license: "varies (per-work)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "1.8亿+ DOI 元数据记录，覆盖学术出版物/会议/书籍"

  # role: aggregator | collect: supplement | cluster: academic_metadata
  # W-AGG-1：cron 关闭；与 openalex 互斥。手动：pnpm cli collect --source semanticscholar
  - id: semanticscholar
    profile: rest_header_custom
    name: Semantic Scholar
    enabled: false
    base_url: https://api.semanticscholar.org/graph/v1
    rate_limit: "10 RPS (authenticated)"
    license: "non-commercial free"
    commercial_use: false
    schedule: "0 3 * * *"
    description: "2亿+ 论文 + 引用图，商业需授权"
    options:
      default_collect_query: science

  # role: primary | collect: main | cluster: academic_metadata
  # 生物医学已发表文献索引真源（NLM）
  - id: pubmed
    profile: ncbi_eutils
    name: "PubMed / NCBI E-utilities"
    enabled: true
    rate_limit: "10/sec (authenticated)"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "生物医学权威数据库，38 个子库"
    options:
      entrez_db: pubmed

  # Legacy 占位；采集请用 arxiv_oai
  - id: arxiv
    profile: arxiv_legacy_rest
    name: arXiv
    enabled: false
    rate_limit: ">=3s interval"
    license: "metadata free"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "Legacy 占位，无 Connector；采集请用 arxiv_oai（enabled: true）"

  # role: primary | collect: main | cluster: academic_preprint
  - id: arxiv_oai
    profile: oai_pmh
    name: arXiv (OAI-PMH)
    enabled: true
    rate_limit: ">=3s interval"
    license: "metadata free"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "arXiv 预印本 OAI-PMH 批量采集；搜索走 Legacy Atom API"
    options:
      search_base_url: https://export.arxiv.org/api/query

  # role: primary | collect: main | cluster: academic_preprint
  - id: biorxiv_oai
    profile: oai_pmh
    name: bioRxiv (OAI-PMH API)
    enabled: true
    base_url: https://api.biorxiv.org
    rate_limit: ">=2s interval"
    license: "varies (per preprint; often CC-BY-NC)"
    commercial_use: false
    schedule: "0 3 * * *"
    description: "bioRxiv 预印本；api.biorxiv.org/details JSON；L2 ✅ 2026-05-20"
    options:
      server: biorxiv

  # role: primary | collect: main | cluster: academic_preprint
  - id: medrxiv_oai
    profile: oai_pmh
    name: medRxiv (OAI-PMH API)
    enabled: true
    base_url: https://api.biorxiv.org
    rate_limit: ">=2s interval"
    license: "varies (per preprint; often CC-BY-NC)"
    commercial_use: false
    schedule: "0 3 * * *"
    description: "medRxiv 预印本；api.biorxiv.org/details/medrxiv JSON；W6-001 enabled 2026-05-21"
    options:
      server: medrxiv

  # role: aggregator | collect: fallback | cluster: academic_fulltext
  # W-AGG-3：保持 disabled；主源无全文时再手动开启
  - id: core
    profile: rest_bearer
    name: CORE
    enabled: false
    base_url: https://api.core.ac.uk/v3
    rate_limit: "token bucket (registered)"
    license: "varies (OA aggregation; attribution required)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "CORE 开放论文全文索引；须 CORE_API_KEY；导出保留 core_attribution"
    options:
      default_collect_query: machine learning

  # role: graph | collect: supplement | cluster: citation_graph
  # 引文边 COCI；不 embed，collect 须种子 DOI
  - id: opencitations
    profile: rest_none
    name: OpenCitations
    enabled: false
    base_url: https://api.opencitations.net/index/v2
    rate_limit: "180 req/min per IP"
    license: "CC0 (OpenCitations Index)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "COCI 引文边 REST；collect 须种子 DOI；可选 OPENCITATIONS_ACCESS_TOKEN"
    options:
      default_collect_query: 10.1038/nature12373
      citation_mode: references

  # role: primary | collect: main | cluster: patent_us
  # 美国专利 USPTO 官方真源
  - id: patentsview
    profile: rest_header_custom
    name: "USPTO ODP Patents"
    enabled: true
    base_url: https://api.uspto.gov
    rate_limit: "not specified"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * 0"
    # 须 USPTO_ODP_API_KEY（Header X-API-KEY）；申请 https://data.uspto.gov/apis/getting-started
    description: "ODP PFW POST /api/v1/patent/applications/search"

  # role: primary | collect: main | cluster: patent_ep
  - id: epo_ops
    profile: oauth2_rest
    name: EPO Open Patent Services (OPS)
    enabled: true
    rate_limit: "4 GB/week free"
    license: "EPO terms (free tier)"
    commercial_use: false
    schedule: "0 3 * * 0"
    description: "OPS published-data CQL 检索（biblio+abstract）；须 EPO_OPS_CONSUMER_KEY/SECRET"
    options:
      token_url: https://ops.epo.org/3.2/auth/accesstoken

  # role: mirror | collect: analysis | cluster: patent_global
  # W-AGG-2：cron 关闭；日常 RAG 用 patentsview/epo_ops。按需：pnpm cli collect --source google_patents
  - id: google_patents
    profile: bigquery_sql
    name: Google Patents Public Data
    enabled: false
    base_url: https://console.cloud.google.com/marketplace/details/google_patents_public_datasets/google-patents-public-data
    rate_limit: "1 TB/month free query"
    license: CC BY 4.0
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "BigQuery patents-public-data.patents.publications；须 GCP_PROJECT_ID + ADC/服务账号"
    options:
      table: patents-public-data.patents.publications
      default_country_code: US
      # 表无分区（3TB，170M 行），列裁剪后实际扫描约 230GB（~$1.15/次）
      maximum_bytes_billed: "300000000000"

  # role: primary | collect: main | cluster: finance_filing
  - id: sec_edgar
    profile: rest_polite
    name: SEC EDGAR
    enabled: true
    base_url: https://data.sec.gov/
    rate_limit: "10/sec"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "SEC 上市公司申报文件 (10-K, 10-Q, 8-K)，完全免费"

  # role: secondary | collect: supplement | cluster: finance_market
  # 非官方 API；行情辅助，基本面以 sec_edgar 为准
  - id: yahoo_finance
    profile: rest_none
    name: Yahoo Finance (unofficial)
    enabled: true
    base_url: https://finance.yahoo.com
    rate_limit: ">=1s interval"
    license: unofficial (yahoo-finance2)
    commercial_use: false
    schedule: "0 3 * * 0"
    description: "行情/搜索（npm yahoo-finance2；非官方 API，无 Key）"
    options:
      default_collect_query: SPY
      quotes_count: 10
      quote_type_filter: EQUITY

  # role: primary | collect: main | cluster: macro_indicator
  - id: fred
    profile: rest_query_param_key
    name: "FRED (Federal Reserve)"
    enabled: true
    base_url: https://api.stlouisfed.org/fred/
    rate_limit: "not specified"
    license: "free (verify commercial)"
    commercial_use: false
    schedule: "0 3 * * *"
    description: "80万+ 经济时间序列"

  # role: primary | collect: main | cluster: macro_indicator
  # 与 fred 部分指标概念重叠，按 series id 选型勿重复采
  - id: worldbank
    profile: rest_none
    name: World Bank Indicators
    enabled: true
    base_url: https://api.worldbank.org/v2/
    rate_limit: "unlimited"
    license: "CC BY"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "16,000+ 时间序列，覆盖 200+ 国家"

  # role: registry | collect: main | cluster: clinical（NCT 注册真源，低重叠）
  - id: clinicaltrials
    profile: rest_none
    name: ClinicalTrials.gov
    enabled: true
    base_url: https://clinicaltrials.gov/api/v2/
    rate_limit: "<=10/sec"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "全球临床试验注册数据"

  # role: primary | collect: main | cluster: code（平台独占）
  - id: github
    profile: rest_bearer
    name: GitHub
    enabled: true
    base_url: https://api.github.com/
    rate_limit: "5000/hour (authenticated)"
    license: "varies (per-repo)"
    commercial_use: true
    schedule: "0 3 * * *"
    description: "开源仓库元数据 + 技术趋势 (stars/forks/commits)"

  # role: primary | collect: main | cluster: community_tech
  - id: hackernews
    profile: firebase_rest
    name: Hacker News
    enabled: true
    rate_limit: "unlimited"
    license: "free"
    commercial_use: true
    schedule: "0 */1 * * *"
    description: "技术社区热点，Firebase 实时数据库（每 1 小时采集）"

  # role: primary | collect: main | cluster: video
  - id: youtube
    profile: youtube_api
    name: YouTube Data API v3
    enabled: true
    base_url: https://www.googleapis.com/youtube/v3/
    rate_limit: "10000 units/day (search=100 units/call)"
    license: "YouTube API Terms of Service"
    commercial_use: false
    schedule: "0 3 * * 0"
    description: "视频搜索元数据；须 YOUTUBE_API_KEY"
    options:
      default_collect_query: machine learning
      max_results_per_page: 25
      max_search_pages: 1
      enrich_statistics: false
      relevance_language: en

  # role: primary | collect: main | cluster: pharma_vertical
  # 波次 7 · 默认 disabled；ChEMBL 无需 Key
  - id: chembl
    profile: rest_none
    name: ChEMBL
    enabled: false
    base_url: https://www.ebi.ac.uk/chembl/api/data
    rate_limit: "fair use (~5/sec)"
    license: "CC BY-SA 3.0"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "EBI 生物活性分子库，靶点/化合物/活性"
    options:
      default_collect_query: aspirin

  # role: primary | collect: main | cluster: pharma_vertical
  # 波次 7 · 默认 disabled；推荐 NCBI_API_KEY 提限速
  - id: pubchem
    profile: rest_none
    name: PubChem
    enabled: false
    base_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    rate_limit: "3/sec (no key) · 10/sec (NCBI_API_KEY)"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "NCBI 化合物数据库，PUG REST 名称/CID 查询"
    options:
      default_collect_query: aspirin

  # role: primary | collect: main | cluster: materials
  # 波次 7 · 默认 disabled；须 MATERIALS_PROJECT_API_KEY
  - id: materials_project
    profile: rest_header_custom
    name: Materials Project
    enabled: false
    base_url: https://api.materialsproject.org
    rate_limit: "registered users"
    license: "CC BY 4.0"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "DFT 计算材料摘要，band gap / 稳定性"
    options:
      default_collect_query: Fe2O3

  # role: primary | collect: main | cluster: energy
  # 波次 7 · 默认 disabled；须 EIA_API_KEY
  - id: eia
    profile: rest_query_param_key
    name: EIA Open Data
    enabled: false
    base_url: https://api.eia.gov/v2
    rate_limit: "not specified"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "美国能源信息署官方能源时间序列"

  # role: primary | collect: main | cluster: community_social
  # 默认关：商业用途须合规评审后再 enabled
  - id: reddit
    profile: oauth2_rest
    name: Reddit
    enabled: false
    base_url: https://oauth.reddit.com/
    rate_limit: "100 QPM"
    license: "Reddit Data API Terms"
    commercial_use: false
    schedule: "0 */2 * * *"
    description: "公开 subreddit 热帖/搜索；须 REDDIT_CLIENT_ID/SECRET + REDDIT_USER_AGENT"
    options:
      token_url: https://www.reddit.com/api/v1/access_token
      subreddits: [MachineLearning, technology, science]
      listing: hot
