# ═══════════════════════════════════════════════════════════════
# data-platform 数据源配置文件 (v1.1)
# ═══════════════════════════════════════════════════════════════
# 优先级：环境变量 > 数据库 > 此文件（展开后）> Connector META
# 修改后：pnpm cli config validate → pnpm cli config sync（或 restart app 自动 sync）
# 设计：docs/plans/数据源配置-interface-profile实施方案.md
# ═══════════════════════════════════════════════════════════════

version: "1.1"

defaults:
  user_agent: "WangyeDataPlatform/0.1 (mailto:dev@wangye.app)"
  request_timeout_ms: 30000
  max_retries: 5

interface_profiles:
  rest_query_param_key:
    protocol: rest
    auth_type: query_param_key

  ncbi_eutils:
    extends: rest_query_param_key
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    env_key: NCBI_API_KEY
    rate_limit: "10/sec (with key)"
    pagination: webenv_history
    pipeline: [esearch, efetch]

  rest_header_custom:
    protocol: rest
    auth_type: header_custom

  rest_polite:
    protocol: rest
    auth_type: polite_id

  rest_none:
    protocol: rest
    auth_type: none

  firebase_rest:
    protocol: firebase_rest
    auth_type: none
    base_url: https://hacker-news.firebaseio.com/v0/

  rest_bearer:
    protocol: rest
    auth_type: header_bearer

  arxiv_legacy_rest:
    protocol: rest
    auth_type: none
    base_url: https://export.arxiv.org/api/query

  oai_pmh:
    protocol: oai-pmh
    auth_type: none
    base_url: https://oaipmh.arxiv.org/oai

  oauth2_rest:
    protocol: rest
    auth_type: oauth2

  bigquery_sql:
    protocol: bigquery_sql
    auth_type: oauth2

  graphql_github:
    protocol: graphql
    auth_type: header_bearer

sources:
  - id: openalex
    profile: rest_query_param_key
    name: OpenAlex
    enabled: true
    base_url: https://api.openalex.org
    rate_limit: "100000/day"
    license: CC0
    commercial_use: true
    schedule: "0 7 * * *"
    description: "2.4亿+ 学术作品元数据，CC0 完全开放，含作者/机构/引用/主题"

  - id: crossref
    profile: rest_polite
    name: CrossRef
    enabled: true
    base_url: https://api.crossref.org/v1
    rate_limit: "5 RPS (polite pool)"
    license: "varies (per-work)"
    commercial_use: true
    schedule: "0 8 * * *"
    description: "1.8亿+ DOI 元数据记录，覆盖学术出版物/会议/书籍"

  - id: semanticscholar
    profile: rest_header_custom
    name: Semantic Scholar
    enabled: false
    base_url: https://api.semanticscholar.org/graph/v1
    rate_limit: "10 RPS (authenticated)"
    license: "non-commercial free"
    commercial_use: false
    schedule: "0 9 * * *"
    description: "2亿+ 论文 + 引用图，商业需授权"
    options:
      default_collect_query: science

  - id: pubmed
    profile: ncbi_eutils
    name: "PubMed / NCBI E-utilities"
    enabled: false
    rate_limit: "10/sec (authenticated)"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 10 * * *"
    description: "生物医学权威数据库，38 个子库"
    options:
      entrez_db: pubmed

  - id: arxiv
    profile: arxiv_legacy_rest
    name: arXiv
    enabled: false
    rate_limit: ">=3s interval"
    license: "metadata free"
    commercial_use: true
    schedule: "0 11 * * *"
    description: "物理/数学/CS 预印本，Legacy Atom 搜索（采集见 arxiv_oai）"

  - id: arxiv_oai
    profile: oai_pmh
    name: arXiv (OAI-PMH)
    enabled: true
    rate_limit: ">=3s interval"
    license: "metadata free"
    commercial_use: true
    schedule: "0 11 * * *"
    description: "arXiv 预印本 OAI-PMH 批量采集；搜索走 Legacy Atom API"
    options:
      search_base_url: https://export.arxiv.org/api/query

  - id: patentsview
    profile: rest_header_custom
    name: "PatentsView (USPTO)"
    enabled: false
    base_url: https://search.patentsview.org/api/v1
    rate_limit: "45/min"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 3 * * 0"
    description: "USPTO 清洗专利数据，研究级质量，含发明人/专利权人标准化"

  - id: sec_edgar
    profile: rest_polite
    name: SEC EDGAR
    enabled: false
    base_url: https://data.sec.gov/
    rate_limit: "10/sec"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 6 * * *"
    description: "SEC 上市公司申报文件 (10-K, 10-Q, 8-K)，完全免费"

  - id: fred
    profile: rest_query_param_key
    name: "FRED (Federal Reserve)"
    enabled: false
    base_url: https://api.stlouisfed.org/fred/
    rate_limit: "not specified"
    license: "free (verify commercial)"
    commercial_use: false
    schedule: "0 5 * * *"
    description: "80万+ 经济时间序列"

  - id: worldbank
    profile: rest_none
    name: World Bank Indicators
    enabled: true
    base_url: https://api.worldbank.org/v2/
    rate_limit: "unlimited"
    license: "CC BY"
    commercial_use: true
    schedule: "0 4 * * 0"
    description: "16,000+ 时间序列，覆盖 200+ 国家"

  - id: clinicaltrials
    profile: rest_none
    name: ClinicalTrials.gov
    enabled: false
    base_url: https://clinicaltrials.gov/api/v2/
    rate_limit: "<=10/sec"
    license: "public domain (US gov)"
    commercial_use: true
    schedule: "0 12 * * *"
    description: "全球临床试验注册数据"

  - id: github
    profile: rest_bearer
    name: GitHub
    enabled: false
    base_url: https://api.github.com/
    rate_limit: "5000/hour (authenticated)"
    license: "varies (per-repo)"
    commercial_use: true
    schedule: "0 2 * * *"
    description: "开源仓库元数据 + 技术趋势 (stars/forks/commits)"

  - id: hackernews
    profile: firebase_rest
    name: Hacker News
    enabled: false
    rate_limit: "unlimited"
    license: "free"
    commercial_use: true
    schedule: "0 */6 * * *"
    description: "技术社区热点，Firebase 实时数据库"
