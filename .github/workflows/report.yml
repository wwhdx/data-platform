name: Data Report

on:
  schedule:
    # 每日 20:00 UTC（北京时间次日 04:00，避开整点高峰）
    - cron: "0 20 * * *"
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次；新提交排队时取消旧部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    name: generate data report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # 报表数据与运行时门闸同源：config validate 不过则不产出报表
      - name: validate config
        run: pnpm cli config validate

      - name: generate report
        run: node --import tsx scripts/generate-report.mjs

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    name: deploy to github pages
    needs: report
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
