name: auto-merge

# Squash-merges PRs that passed automated review (label `devin-review-approved`)
# once every check on the head commit has succeeded. Runs as GitHub Actions
# because OpenHands sessions are not permitted to merge into master.

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  # GITHUB_TOKEN recursion protection means Actions-created check suites never
  # fire this event, so a PR can end up fully green with nothing left to
  # evaluate it. The cron is the deadlock escape hatch.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to evaluate
        required: false

permissions:
  contents: write
  pull-requests: write
  # statusCheckRollup in the GraphQL query needs read access to checks/statuses;
  # without these the whole query fails with "Resource not accessible by integration"
  checks: read
  statuses: read

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          SELF_CHECK_NAME: auto-merge
        run: |
          set -euo pipefail

          # Wait until every non-automerge check on the head commit reaches a
          # final state. Evaluating immediately after a trigger races against
          # sibling workflows (dependabot-auto-merge) that are still running
          # and always yields "checks still running".
          wait_for_checks_settled() {
            local pr="$1" waited=0
            while [ "$waited" -lt 480 ]; do
              pending=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$pr" -f query='
                query($owner:String!, $name:String!, $pr:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$pr) {
                      commits(last:1) { nodes { commit { statusCheckRollup {
                        contexts(first:100) { nodes {
                          __typename
                          ... on CheckRun { name status }
                          ... on StatusContext { context state }
                        } }
                      } } } }
                    }
                  }
                }' \
                | jq -r --arg self "$SELF_CHECK_NAME" '
                [ .data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                  | select((.__typename == "CheckRun" and .name != $self and (.name | endswith("-auto-merge") | not)) or .__typename == "StatusContext")
                  | select((.__typename == "CheckRun" and .status != "COMPLETED") or (.__typename == "StatusContext" and .state == "PENDING")) ]
                | length' || echo 1)
              [ "$pending" -eq 0 ] && return 0
              sleep 15
              waited=$((waited + 15))
            done
            return 1
          }

          candidates() {
            if [ -n "$EVENT_PR" ]; then
              echo "$EVENT_PR"
              return
            fi
            # check_suite/schedule events carry no PR number: evaluate open PRs on master
            gh pr list --repo "$REPO" --state open --base master --json number --jq '.[].number'
          }

          for pr in $(candidates); do
            echo "::group::PR #$pr"
            if ! wait_for_checks_settled "$pr"; then
              echo "not merging: check runs did not settle within 8m"
              echo "::endgroup::"
              continue
            fi
            if ! data=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F pr="$pr" -f query='
              query($owner:String!, $name:String!, $pr:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$pr) {
                    state isDraft mergeable mergeStateStatus baseRefName title
                    labels(first:50) { nodes { name } }
                    reviewDecision
                    reviewThreads(first:100) { nodes { isResolved isOutdated } }
                    commits(last:1) { nodes { commit { statusCheckRollup {
                      contexts(first:100) { nodes {
                        __typename
                        ... on CheckRun { name status conclusion }
                        ... on StatusContext { context state }
                      } }
                    } } } }
                  }
                }
              }'); then
              echo "could not query PR #$pr — skipping"
              echo "::endgroup::"
              continue
            fi

            verdict=$(echo "$data" | jq -r --arg self "$SELF_CHECK_NAME" '
              .data.repository.pullRequest as $p
              | ($p.labels.nodes | map(.name)) as $labels
              | [ $p.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                  | select((.__typename == "CheckRun" and .name != $self and (.name | endswith("-auto-merge") | not)) or .__typename == "StatusContext") ] as $checks
              | [ if $p.state != "OPEN" then "PR is not open" else empty end,
                  if $p.isDraft then "PR is a draft" else empty end,
                  if $p.baseRefName != "master" then "base branch is not master" else empty end,
                  if ($labels | index("devin-review-approved")) == null and $p.reviewDecision != "APPROVED"
                    then "no approving review and no devin-review-approved label" else empty end,
                  if ($labels | index("devin-review-changes-requested")) != null then "devin-review-changes-requested label present" else empty end,
                  if $p.reviewDecision == "CHANGES_REQUESTED" then "outstanding CHANGES_REQUESTED review" else empty end,
                  if ($labels | any(. == "do-not-merge" or . == "wip" or . == "blocked")) then "blocking label present" else empty end,
                  if ($p.title | ascii_downcase | test("\\bwip\\b|\\bdraft\\b")) then "title marks the PR as WIP/DRAFT" else empty end,
                  if ($checks | length) == 0 then "no checks on the head commit" else empty end,
                  if ($checks | any(.__typename == "CheckRun" and .status != "COMPLETED")) then "checks still running" else empty end,
                  if ($checks | any((.__typename == "CheckRun" and (.conclusion | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
                                    or (.__typename == "StatusContext" and .state != "SUCCESS")))
                    then "at least one check did not succeed" else empty end,
                  if ($p.reviewThreads.nodes | any(.isResolved == false and .isOutdated == false)) then "unresolved review threads" else empty end,
                  if $p.mergeable != "MERGEABLE" or ($p.mergeStateStatus | IN("DIRTY","BLOCKED","BEHIND")) then "not cleanly mergeable (\($p.mergeStateStatus))" else empty end
                ] | join("; ")')

            if [ -z "$verdict" ]; then
              echo "all criteria met — squash-merging"
              gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
              gh pr comment "$pr" --repo "$REPO" --body ":robot: Auto-merged by the \`auto-merge\` workflow: review approved and all checks succeeded on the head commit."
            else
              echo "not merging: $verdict"
            fi
            echo "::endgroup::"
          done
