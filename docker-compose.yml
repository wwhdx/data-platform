networks:
  dp-network:

services:

  # ── PostgreSQL (pgvector) ─────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - dp-network
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/storage/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d data_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (本地 Embedding) ──────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - dp-network
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 模型拉取（一次性）────────────────────
  ollama-init:
    image: ollama/ollama:latest
    networks:
      - dp-network
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling bge-m3..."
        ollama serve &
        sleep 5
        ollama pull bge-m3
        echo "bge-m3 ready"
    depends_on:
      - ollama

  # ── data-platform API 服务 ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3400:3400"
    networks:
      - dp-network
    environment:
      DATA_PLATFORM_DATABASE_URL: postgresql://lumina:lumina_pass@db:5432/data_platform
      DATA_PLATFORM_RAW_MIRROR: /data/raw
      DATA_PLATFORM_COLLECT_LOG_DIR: /data/logs/collect
      EMBED_BACKEND: ollama
      EMBED_API_URL: http://ollama:11434
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      NODE_ENV: production
      PORT: "3400"
    volumes:
      - ./config:/app/config:ro
      - ./data/raw:/data/raw
      - ./data/logs/collect:/data/logs/collect
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama_models:
