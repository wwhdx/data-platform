networks:
  dp-network:

services:

  # ── PostgreSQL (pgvector) ─────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - dp-network
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/storage/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d data_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama (Docker 内 Embedding；勿与本机 ollama serve 同占 11434) ──
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - dp-network
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 模型拉取（一次性，经 ollama 服务拉取，不另起 serve）────────
  ollama-init:
    image: ollama/ollama:latest
    networks:
      - dp-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling bge-m3..."
        ollama pull bge-m3
        echo "bge-m3 ready"
    depends_on:
      ollama:
        condition: service_healthy

  # ── data-platform API 服务 ────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3400:3400"
    networks:
      - dp-network
    env_file:
      - .env
    environment:
      # 覆盖 .env 中面向宿主机的值，容器内须用服务名
      DATA_PLATFORM_DATABASE_URL: postgresql://lumina:lumina_pass@db:5432/data_platform
      DATA_PLATFORM_RAW_MIRROR: /data/raw
      DATA_PLATFORM_COLLECT_LOG_DIR: /data/logs/collect
      EMBED_BACKEND: ollama
      EMBED_API_URL: http://ollama:11434
      NODE_ENV: production
      PORT: "3400"
    volumes:
      - ./config:/app/config:ro
      - ./data/raw:/data/raw
      - ./data/logs/collect:/data/logs/collect
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama_models:
