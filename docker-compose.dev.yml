# 开发模式：挂载源码 + tsx watch 热重载
networks:
  dp-network:

services:

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks:
      - dp-network
    environment:
      POSTGRES_DB: data_platform
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_pass
    ports:
      - "5433:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
      - ./src/storage/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d data_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 勿与本机 `ollama serve` 同占宿主机 11434
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - dp-network
    volumes:
      - dev_ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    networks:
      - dp-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling bge-m3..."
        ollama pull bge-m3
        echo "bge-m3 ready"
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3400:3400"
    networks:
      - dp-network
    volumes:
      - ./src:/app/src
      - ./data/raw:/data/raw
    environment:
      DATA_PLATFORM_DATABASE_URL: postgresql://lumina:lumina_pass@db:5432/data_platform
      DATA_PLATFORM_RAW_MIRROR: /data/raw
      EMBED_BACKEND: ollama
      EMBED_API_URL: http://ollama:11434
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      NODE_ENV: development
      PORT: "3400"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  dev_pgdata:
  dev_ollama_models:
