services:
  db:
    image: ${REPORT_POSTGRES_IMAGE:?Set a pinned PostgreSQL image digest}
    container_name: farview-report-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: data_platform_report
      POSTGRES_USER: report_admin
      POSTGRES_PASSWORD: ${REPORT_POSTGRES_PASSWORD:?Set the private database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - max_wal_size=256MB
    volumes:
      - ${REPORT_PGDATA_DIR:-/srv/data-platform/pgdata}:/var/lib/postgresql/data
    networks:
      - report
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD-SHELL, pg_isready -U report_admin -d data_platform_report]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  report:
    name: farview-report-net
