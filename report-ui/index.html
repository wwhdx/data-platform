<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>望野 · 数据采集报表</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://farview.cn">望野<span>Farview</span></a>
    <div class="topbar-meta">
      <span id="env" class="env"></span>
      <span id="generated" class="muted"></span>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <p class="eyebrow">DATA PLATFORM / SOURCE REPORT</p>
      <h1>数据采集报表</h1>
      <p class="lede">近期内容优先，周期数据与较旧样本分别展示。来源于独立探活与抽样；页面反映最近一次报表快照。</p>
    </section>

    <section id="kpis" class="kpis" aria-label="核心指标"></section>

    <section id="warnings" class="warnings" aria-label="需要关注" hidden></section>

    <section class="panel">
      <div class="panel-head">
        <h2>数据源</h2>
        <span id="count" class="count" aria-live="polite"></span>
      </div>

      <div class="toolbar">
        <input id="search" type="search" aria-label="搜索数据源或样本" placeholder="搜索源 / 行业 / 协议 / 样本标题…" autocomplete="off">
        <select id="order" aria-label="排列方式">
          <option value="recent">近期优先</option>
          <option value="name">源名称</option>
          <option value="issues">异常优先</option>
        </select>
        <select id="group" aria-label="内容时效筛选">
          <option value="">全部时效</option>
          <option value="recent">近期内容</option>
          <option value="periodic">周期数据</option>
          <option value="older">较旧内容</option>
          <option value="unknown">时间待确认</option>
          <option value="unavailable">暂无可用内容</option>
          <option value="disabled">未启用</option>
        </select>
        <select id="status" aria-label="状态筛选">
          <option value="">全部状态</option>
          <option value="healthy">探活正常</option>
          <option value="degraded">降级 / 限流</option>
          <option value="error">探活失败</option>
          <option value="skipped">未探活 / 未启用</option>
        </select>
        <select id="industry" aria-label="行业筛选"><option value="">全部行业</option></select>
        <select id="protocol" aria-label="协议筛选"><option value="">全部协议</option></select>
        <label class="check"><input id="withSample" type="checkbox"> 只看有样本</label>
      </div>
      <p class="sort-note">顺序由数据库查询生成；抓取成功时间与内容时间分别显示。探活异常始终保留在上方。</p>

      <div id="sources" class="sources"></div>
      <p id="empty" class="empty" hidden>没有匹配的数据源。</p>
    </section>

    <footer class="footer">
      <span>data-platform report · 由 <code>scripts/generate-report.mjs</code> 生成</span>
      <span><a href="/report.json">report.json</a> · <a href="/api/v1/index.json">API 索引</a> · <a href="/api/v1/samples.ndjson">样本 NDJSON</a> · <a href="https://farview.cn">farview.cn</a></span>
    </footer>
  </main>

  <noscript>
    <p class="noscript">需要启用 JavaScript 才能渲染报表。可直接查看 <a href="/report.json">report.json</a>。</p>
  </noscript>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
